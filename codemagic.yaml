workflows:
  ios-demo-build:
    name: iOS Simulator Demo Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate ai_secrets.dart
        script: |
          # A value pasted into the Codemagic dashboard can carry a
          # trailing newline. Interpolated into a Dart string literal that
          # newline lands before the closing quote and the build fails on
          # an unterminated string, so strip whitespace first.
          KEY=$(printf %s "$GEMINI_API_KEY" | tr -d "[:space:]")
          cat > lib/services/ai_secrets.dart <<EOF
          // Generated by CI. Do not commit.
          const String geminiApiKey = '$KEY';
          EOF
          echo "ai_secrets.dart written (key length: ${#KEY})"
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS app for simulator
        script: |
          flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
    publishing:
      email:
        recipients:
          - dmin0820@gmail.com

  ios-unsigned-device-build:
    name: iOS Unsigned Device IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - gemini   # dashboard variable group holding GEMINI_API_KEY (mark it Secure)
    scripts:
      - name: Generate ai_secrets.dart
        script: |
          # A value pasted into the Codemagic dashboard can carry a
          # trailing newline. Interpolated into a Dart string literal that
          # newline lands before the closing quote and the build fails on
          # an unterminated string, so strip whitespace first.
          KEY=$(printf %s "$GEMINI_API_KEY" | tr -d "[:space:]")
          if [ -z "$KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is empty."
            echo "This workflow lists the 'gemini' variable group, so the"
            echo "variable must exist in it and be named exactly"
            echo "GEMINI_API_KEY. Failing now rather than shipping an app"
            echo "whose AI features report themselves unconfigured."
            exit 1
          fi
          cat > lib/services/ai_secrets.dart <<EOF
          // Generated by CI. Do not commit.
          const String geminiApiKey = '$KEY';
          EOF
          echo "ai_secrets.dart written (key length: ${#KEY})"
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build unsigned iOS app artifact
        script: |
          set -e
          export GEMINI_API_KEY="$(printf %s "$GEMINI_API_KEY" | tr -d "[:space:]")"
          # Two-stage build on purpose. "flutter build ios --no-codesign"
          # still honours the CODE_SIGN_IDENTITY the Xcode template sets,
          # so on a CI mac with no Apple account session it stops and
          # demands a Development Team. Instead: let Flutter write its
          # config, then drive xcodebuild ourselves with signing switched
          # off outright. Sideloadly re-signs with your own Apple ID at
          # install time, so an unsigned artifact is the goal here.
          flutter build ios --config-only --release --no-codesign \
            --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

          DD="$PWD/build/ios_dd"
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
          cd ..

          # Locate the built Runner.app (path differs by Flutter/Xcode version).
          APP=""
          for p in \
            "build/ios_dd/Build/Products/Release-iphoneos/Runner.app" \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"; do
            if [ -d "$p" ]; then APP="$p"; break; fi
          done
          if [ -z "$APP" ]; then
            echo "ERROR: Runner.app not found after build" >&2
            exit 1
          fi
          echo "Using app at: $APP"

          # Package as a proper unsigned .ipa (Payload/Runner.app) — this is the
          # format Sideloadly expects; it re-signs with your Apple ID on install.
          mkdir -p build/artifacts/Payload
          cp -R "$APP" build/artifacts/Payload/
          cd build/artifacts
          zip -r GroupApp-unsigned.ipa Payload -x "*.DS_Store"
          rm -rf Payload
    artifacts:
      - build/artifacts/*.ipa
    publishing:
      email:
        recipients:
          - dmin0820@gmail.com
