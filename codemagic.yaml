workflows:
  ios-demo-build:
    name: iOS Simulator Demo Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate ai_secrets.dart
        script: |
          cat > lib/services/ai_secrets.dart <<EOF
          // Generated by CI. Do not commit.
          const String geminiApiKey = '$GEMINI_API_KEY';
          EOF
          echo "ai_secrets.dart written (key length: ${#GEMINI_API_KEY})"
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS app for simulator
        script: |
          flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
    publishing:
      email:
        recipients:
          - dmin0820@gmail.com

  ios-unsigned-device-build:
    name: iOS Unsigned Device IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - gemini   # dashboard variable group holding GEMINI_API_KEY (mark it Secure)
    scripts:
      - name: Generate ai_secrets.dart
        script: |
          cat > lib/services/ai_secrets.dart <<EOF
          // Generated by CI. Do not commit.
          const String geminiApiKey = '$GEMINI_API_KEY';
          EOF
          echo "ai_secrets.dart written (key length: ${#GEMINI_API_KEY})"
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build unsigned iOS app artifact
        script: |
          set -e
          export GEMINI_API_KEY="$GEMINI_API_KEY"
          flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

          # Locate the built Runner.app (path differs by Flutter/Xcode version).
          APP=""
          for p in \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"; do
            if [ -d "$p" ]; then APP="$p"; break; fi
          done
          if [ -z "$APP" ]; then
            echo "ERROR: Runner.app not found after build" >&2
            exit 1
          fi
          echo "Using app at: $APP"

          # Package as a proper unsigned .ipa (Payload/Runner.app) — this is the
          # format Sideloadly expects; it re-signs with your Apple ID on install.
          mkdir -p build/artifacts/Payload
          cp -R "$APP" build/artifacts/Payload/
          cd build/artifacts
          zip -r GroupApp-unsigned.ipa Payload -x "*.DS_Store"
          rm -rf Payload
    artifacts:
      - build/artifacts/*.ipa
    publishing:
      email:
        recipients:
          - dmin0820@gmail.com
